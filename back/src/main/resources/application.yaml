

spring:
  application:
    name: dotacion
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dotacion}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  config:
    import: optional:file:.env[.properties]


server:
  port: ${SERVER_PORT:8080}

app:
  company-name: ${COMPANY_NAME:Inventario Dotacion S.A.S.}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
    mail-from: ${MAIL_FROM}
    birthday-subject: ${NOTIFICATIONS_BIRTHDAY_SUBJECT:Felicitaciones en tu cumpleanos}
    birthday-cron: ${NOTIFICATIONS_BIRTHDAY_CRON:0 0 8 * * *}
    birthday-zone: ${NOTIFICATIONS_BIRTHDAY_ZONE:America/Bogota}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}

gg:
  jte:
    template-location: src/main/resources/templates
    developmentMode: true